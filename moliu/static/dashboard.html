<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>故事看板 - 墨流</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }

/* 顶栏 */
.header { margin-bottom: 32px; }
.header h1 { font-size: 28px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
.header .subtitle { font-size: 14px; color: #888; }

/* 卡片网格 */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 32px; }
.card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; transition: box-shadow .2s; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }
.card .label { font-size: 13px; color: #888; margin-bottom: 8px; }
.card .value { font-size: 32px; font-weight: 700; color: #1a1a1a; }
.card .value.warn { color: #f59e0b; }
.card .value.good { color: #10b981; }
.card .value.info { color: #3b82f6; }

/* 进度条 */
.progress-bar { background: #e5e7eb; border-radius: 8px; height: 8px; overflow: hidden; margin-top: 8px; }
.progress-bar .fill { height: 100%; border-radius: 8px; background: linear-gradient(90deg, #3b82f6, #8b5cf6); transition: width .5s; }

/* 章节列表 */
.section { margin-bottom: 24px; }
.section h2 { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.chapter-list { display: flex; flex-direction: column; gap: 4px; }
.chapter-item { display: grid; grid-template-columns: 60px 1fr 120px 80px; align-items: center; padding: 10px 16px; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; cursor: pointer; transition: background .2s; }
.chapter-item:hover { background: #f9fafb; }
.chapter-item .num { color: #9ca3af; font-size: 13px; }
.chapter-item .title { color: #1a1a1a; }
.chapter-item .emotion { color: #6b7280; font-size: 12px; }
.chapter-item .words { color: #9ca3af; font-size: 12px; text-align: right; }
.chapter-item.missing { border-color: #f59e0b44; }
.chapter-item.missing .title::after { content: ' (缺元数据)'; color: #f59e0b; font-size: 11px; }

/* 元数据缺失 */
.missing-summary { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.missing-tag { padding: 4px 12px; border-radius: 20px; font-size: 13px; }
.missing-tag.title { background: #f59e0b22; color: #f59e0b; border: 1px solid #f59e0b44; }
.missing-tag.emotion { background: #ef444422; color: #ef4444; border: 1px solid #ef444444; }
.missing-tag.events { background: #3b82f622; color: #3b82f6; border: 1px solid #3b82f644; }

/* 分页 */
.pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; }
.pagination button { padding: 6px 16px; border: 1px solid #e0e0e0; border-radius: 6px; background: #fff; color: #1a1a1a; cursor: pointer; font-size: 13px; }
.pagination button:hover { background: #f9fafb; }
.pagination button:disabled { opacity: .4; cursor: not-allowed; }
.pagination .page-info { font-size: 13px; color: #6b7280; }

/* 加载 */
.loading { text-align: center; padding: 60px; color: #6b7280; }
.loading .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #2a2a2a; border-top-color: #3b82f6; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 响应式 */
@media (max-width: 768px) {
  .chapter-item { grid-template-columns: 50px 1fr 80px; }
  .chapter-item .emotion { display: none; }
}

/* 统一导航栏 */
.navbar { display: flex; align-items: center; gap: 0; background: #fff; border-bottom: 1px solid #e0e0e0; padding: 0 24px; height: 48px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.navbar-brand { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-right: 24px; text-decoration: none; }
.navbar-nav { display: flex; gap: 0; list-style: none; }
.navbar-nav a { padding: 6px 14px; font-size: 13px; color: #6b7280; text-decoration: none; border-radius: 6px; transition: all .15s; }
.navbar-nav a:hover { background: #f3f4f6; color: #1a1a1a; }
.navbar-nav a.active { background: #3b82f611; color: #3b82f6; font-weight: 500; }
</style>
</head>
<body>
<div id="app">
  <nav class="navbar">
    <a class="navbar-brand" href="/static/dashboard.html">墨流</a>
    <ul class="navbar-nav">
      <li><a href="/static/dashboard.html" class="active">故事看板</a></li>
      <li><a href="/static/volumes.html">卷规划</a></li>
      <li><a href="/static/generator.html">生成章节</a></li>
      <li><a href="/docs">API 文档</a></li>
    </ul>
  </nav>
  <div class="container">
    <!-- 顶栏 -->
    <div class="header">
      <h1>{{ status.novel_title || '故事看板' }}</h1>
      <div class="subtitle">墨流小说创作引擎</div>
    </div>

    <!-- 加载 -->
    <div v-if="loading" class="loading">
      <div class="spinner"></div>
      <div>加载中...</div>
    </div>

    <template v-else>
      <!-- 数据卡片 -->
      <div class="grid">
        <div class="card">
          <div class="label">总章节</div>
          <div class="value">{{ status.total_chapters }}</div>
          <div class="progress-bar"><div class="fill" :style="{ width: status.progress_percent + '%' }"></div></div>
          <div style="font-size:12px;color:#666;margin-top:4px;">目标 1000 章 · {{ status.progress_percent }}%</div>
        </div>
        <div class="card">
          <div class="label">总字数</div>
          <div class="value">{{ formatNumber(status.total_words) }}</div>
          <div style="font-size:12px;color:#666;margin-top:4px;">平均每章约 {{ status.total_chapters ? Math.round(status.total_words / status.total_chapters) : 0 }} 字</div>
        </div>
        <div class="card">
          <div class="label">卷</div>
          <div class="value info">{{ status.total_volumes }}</div>
        </div>
        <div class="card">
          <div class="label">角色</div>
          <div class="value good">{{ status.total_characters }}</div>
        </div>
      </div>

      <!-- 元数据缺失 -->
      <div class="missing-summary" v-if="status.missing_title || status.missing_emotion || status.missing_events">
        <span class="missing-tag title" v-if="status.missing_title">缺标题: {{ status.missing_title }}</span>
        <span class="missing-tag emotion" v-if="status.missing_emotion">缺情绪: {{ status.missing_emotion }}</span>
        <span class="missing-tag events" v-if="status.missing_events">缺事件: {{ status.missing_events }}</span>
      </div>

      <!-- 章节列表 -->
      <div class="section">
        <h2>📖 章节列表</h2>
        <div class="chapter-list">
          <div v-for="ch in chapters" :key="ch.chapter_num" class="chapter-item" :class="{ missing: !ch.emotion && !ch.title }" @click="openChapter(ch.chapter_num)">
            <span class="num">#{{ ch.chapter_num }}</span>
            <span class="title">{{ ch.title || '第' + ch.chapter_num + '章' }}</span>
            <span class="emotion">{{ ch.emotion || '—' }}</span>
            <span class="words">{{ formatNumber(ch.word_count) }}字</span>
          </div>
          <div v-if="chapters.length === 0" style="text-align:center;padding:40px;color:#666;">暂无章节数据</div>
        </div>
        <div class="pagination">
          <button :disabled="page <= 1" @click="page--">上一页</button>
          <span class="page-info">第 {{ page }} 页（{{ status.total_chapters }} 章）</span>
          <button :disabled="page * pageSize >= status.total_chapters" @click="page++">下一页</button>
        </div>
      </div>
    </template>
  </div>
</div>

<script>
const { createApp, ref, reactive, computed, watch, onMounted } = Vue;

createApp({
  setup() {
    const loading = ref(true);
    const status = reactive({ novel_title: '', total_chapters: 0, total_volumes: 0, total_characters: 0, total_words: 0, progress_percent: 0, missing_title: 0, missing_emotion: 0, missing_events: 0 });
    const chapters = ref([]);
    const page = ref(1);
    const pageSize = 50;

    const api = (path) => {
      const base = window.location.origin;
      return base + '/api/v1' + path;
    };

    const fetchStatus = async () => {
      try {
        const r = await fetch(api('/status'));
        const data = await r.json();
        Object.assign(status, data);
      } catch (e) {
        console.error('Failed to fetch status:', e);
      }
    };

    const fetchChapters = async () => {
      try {
        const start = (page.value - 1) * pageSize + 1;
        const end = start + pageSize - 1;
        const r = await fetch(api(`/chapters?start=${start}&end=${end}`));
        const data = await r.json();
        chapters.value = data.chapters || [];
      } catch (e) {
        console.error('Failed to fetch chapters:', e);
      }
    };

    const load = async () => {
      loading.value = true;
      await Promise.all([fetchStatus(), fetchChapters()]);
      loading.value = false;
    };

    watch(page, fetchChapters);
    onMounted(load);

    const formatNumber = (n) => {
      if (!n) return '0';
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    };

    const openChapter = (num) => {
      window.open('/api/v1/chapters/' + num, '_blank');
    };

    return { loading, status, chapters, page, pageSize, formatNumber, openChapter };
  }
}).mount('#app');
</script>
</body>
</html>
