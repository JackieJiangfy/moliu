<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨流 · 小说创作工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        serif: ['"Noto Serif SC"', 'serif'],
        brush: ['"Ma Shan Zheng"', 'cursive'],
        xiaowei: ['"ZCOOL XiaoWei"', 'serif'],
      },
      colors: {
        ink: {
          50: '#f7f5f2', 100: '#ede8e1', 200: '#dcd3c7',
          300: '#c4b8a7', 400: '#a89880', 500: '#8a7960',
          600: '#6f5e4a', 700: '#564636', 800: '#3d3025', 900: '#261d16',
          950: '#17110c',
        },
        vermilion: { 400: '#d65650', 500: '#c8453c', 600: '#a8392f', 700: '#8a2d26' },
        bamboo: { 400: '#7da35e', 500: '#6b8e4e', 600: '#557340' },
        gold: { 400: '#d9bd7a', 500: '#c9a961', 600: '#a88a45' },
      },
    },
  },
};
</script>
<style>
  :root { --bg: #f7f5f2; --paper: #ffffff; --ink: #261d16; --ink-soft: #564636; --line: #dcd3c7; }
  * { -webkit-font-smoothing: antialiased; }
  body { font-family: 'Noto Serif SC', serif; background: var(--bg); color: var(--ink); }
  .font-brush { font-family: 'Ma Shan Zheng', cursive; }
  .font-xiaowei { font-family: 'ZCOOL XiaoWei', serif; }
  .paper-bg {
    background-color: var(--paper);
    background-image: radial-gradient(circle at 20% 30%, rgba(138,121,96,0.04) 0%, transparent 40%),
                      radial-gradient(circle at 80% 70%, rgba(138,121,96,0.03) 0%, transparent 40%);
  }
  .scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar::-webkit-scrollbar-thumb { background: #c4b8a7; border-radius: 3px; }

  .seal {
    display: inline-flex; align-items: center; justify-content: center;
    background: #c8453c; color: #fff; font-family: 'Ma Shan Zheng', cursive;
    border-radius: 4px; padding: 2px 10px; transform: rotate(-2deg);
    box-shadow: 0 2px 8px rgba(200,69,60,0.3); letter-spacing: 2px;
  }
  .msg-user { background: linear-gradient(135deg, #3d3025, #564636); color: #f7f5f2; }
  .msg-ai { background: #fff; border: 1px solid #ede8e1; box-shadow: 0 1px 3px rgba(38,29,22,0.05); }
  .msg-ai pre { background: #17110c; color: #ede8e1; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; font-family: 'Consolas', monospace; font-size: 13px; }
  .msg-ai h3 { font-weight: 700; color: #261d16; margin: 12px 0 4px; font-size: 15px; }
  .msg-ai h4 { font-weight: 700; color: #3d3025; margin: 8px 0 2px; font-size: 14px; }
  .msg-ai strong { color: #261d16; }
  .msg-ai code:not(pre code) { background: #ede8e1; padding: 1px 5px; border-radius: 3px; font-size: 13px; color: #8a2d26; }
  .msg-ai ul, .msg-ai ol { padding-left: 20px; margin: 4px 0; }
  .msg-ai li { margin: 2px 0; }
  .tab-btn { transition: all 0.25s ease; position: relative; }
  .tab-btn.active { color: #c8453c; background: rgba(200,69,60,0.05); }
  .tab-btn.active::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #c8453c; border-radius: 0 2px 2px 0; }
  .chapter-card { transition: all 0.2s ease; cursor: pointer; }
  .chapter-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(38,29,22,0.12); }
  .ink-input { transition: all 0.2s; }
  .ink-input:focus { outline: none; border-color: #8a7960; box-shadow: 0 0 0 3px rgba(138,121,96,0.15); }
  .typing-dot { animation: blink 1.4s infinite both; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  .fade-in { animation: fadeIn 0.4s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .slide-up { animation: slideUp 0.3s ease both; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .skeleton { background: linear-gradient(90deg, #ede8e1 25%, #dcd3c7 50%, #ede8e1 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .toast-item { animation: toastIn 0.3s ease both; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
  .streaming-cursor::after { content: '▊'; color: #c8453c; animation: cursorBlink 0.8s infinite; }
  @keyframes cursorBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  @media (max-width: 768px) {
    .sidebar { position: fixed; left: -256px; z-index: 50; height: 100%; transition: left 0.3s; }
    .sidebar.open { left: 0; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; }
    .sidebar-overlay.show { display: block; }
  }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>

<div id="toast-container" class="fixed top-4 right-4 z-[100] space-y-2"></div>
<div id="modal-container"></div>
<script>
const API = '/api/v1';
const OPENAI_API = '/v1';
const state = { models: [], currentModel: '', messages: [], volumes: [], volumeFilter: '', chapterSearch: '', chapterRange: { start: 1, end: 50 }, pageSize: 50 };

// Toast
function toast(msg, type, duration) {
  type = type || 'info'; duration = duration || 3000;
  const colors = { success: 'bg-bamboo-500', error: 'bg-vermilion-500', info: 'bg-ink-700', warn: 'bg-gold-500' };
  const icons = { success: '✓', error: '✕', info: 'ℹ', warn: '⚠' };
  const div = document.createElement('div');
  div.className = 'toast-item ' + (colors[type]||colors.info) + ' text-white px-4 py-3 rounded-lg shadow-lg text-sm flex items-center gap-2 max-w-sm';
  div.innerHTML = '<span class="font-bold">' + (icons[type]||icons.info) + '</span><span>' + escapeHtml(msg) + '</span>';
  document.getElementById('toast-container').appendChild(div);
  setTimeout(function() { div.style.opacity='0'; div.style.transform='translateX(100%)'; div.style.transition='all 0.3s'; setTimeout(function(){div.remove();}, 300); }, duration);
}

// Modal
function showModal(html, wide) {
  const maxW = wide ? 'max-w-3xl' : 'max-w-lg';
  document.getElementById('modal-container').innerHTML = '<div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" id="modal-overlay"><div class="bg-white rounded-lg '+maxW+' w-full max-h-[85vh] overflow-y-auto scrollbar slide-up">' + html + '</div></div>';
  document.getElementById('modal-overlay').addEventListener('click', function(e) { if (e.target.id === 'modal-overlay') closeModal(); });
}
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }
function confirmDialog(title, msg) {
  return new Promise(function(resolve) {
    showModal('<div class="p-6"><h3 class="font-bold text-lg text-ink-900 mb-2">' + escapeHtml(title) + '</h3><p class="text-sm text-ink-600 mb-6">' + escapeHtml(msg) + '</p><div class="flex justify-end gap-3"><button id="confirm-no" class="px-4 py-2 text-sm text-ink-600 hover:bg-ink-100 rounded">取消</button><button id="confirm-yes" class="px-4 py-2 text-sm bg-vermilion-500 hover:bg-vermilion-600 text-white rounded">确认</button></div></div>');
    document.getElementById('confirm-yes').addEventListener('click', function() { closeModal(); resolve(true); });
    document.getElementById('confirm-no').addEventListener('click', function() { closeModal(); resolve(false); });
  });
}

function escapeHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function renderMarkdown(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/```([\s\S]*?)```/g, function(m,c){ return '<pre>'+c.trim()+'</pre>'; });
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
  html = html.replace(/\n/g, '<br>');
  html = html.replace(/<br>(<ul>)/g, '$1').replace(/(<\/ul>)<br>/g, '$1');
  html = html.replace(/<pre>([\s\S]*?)<\/pre>/g, function(m,c){ return '<pre>'+c.replace(/<br>/g,'\n')+'</pre>'; });
  return html;
}
function skeletonCard() { return '<div class="paper-bg border border-ink-200 rounded-lg p-4"><div class="skeleton h-4 w-1/3 mb-3"></div><div class="skeleton h-3 w-full mb-2"></div><div class="skeleton h-3 w-2/3"></div></div>'; }

async function api(path, options) {
  options = options || {};
  const res = await fetch(API + path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, options));
  if (!res.ok) { const err = await res.json().catch(function(){ return {detail: res.statusText}; }); throw new Error(typeof err.detail === 'string' ? err.detail : JSON.stringify(err.detail)); }
  return res.status === 204 ? null : res.json();
}

async function checkStatus() {
  try {
    const data = await api('/status');
    document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-bamboo-500';
    document.getElementById('status-text').textContent = '已连接';
    document.getElementById('novel-info').textContent = data.novel_title || data.title || '墨流';
    loadProgress();
  } catch(e) {
    document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-vermilion-500';
    document.getElementById('status-text').textContent = '未连接';
  }
}

async function loadProgress() {
  try {
    const vols = await api('/volumes');
    if (vols.length === 0) return;
    // 统计每卷已生成章节数
    const outputDir = '/api/v1/chapters';
    let totalChapters = 0, totalWritten = 0;
    const volProgress = [];
    for (const v of vols) {
      const chStart = v.chapter_start, chEnd = v.chapter_end;
      const chCount = chEnd - chStart + 1;
      totalChapters += chCount;
      // 查该卷范围已生成的章节数
      const data = await api('/chapters?start='+chStart+'&end='+chEnd);
      const written = (data.chapters || []).length;
      totalWritten += written;
      volProgress.push({ id: v.id, name: v.name, status: v.status, written: written, total: chCount });
    }
    const percent = totalChapters > 0 ? Math.round(totalWritten / totalChapters * 100) : 0;
    document.getElementById('progress-panel').classList.remove('hidden');
    document.getElementById('progress-text').textContent = totalWritten + '/' + totalChapters + ' (' + percent + '%)';
    document.getElementById('progress-bar').style.width = percent + '%';
    const volHtml = volProgress.map(function(vp) {
      const p = vp.total > 0 ? Math.round(vp.written / vp.total * 100) : 0;
      const stColor = { completed: 'bg-bamboo-500', active: 'bg-vermilion-500', planned: 'bg-ink-300' }[vp.status] || 'bg-ink-300';
      return '<div class="flex items-center gap-2 text-xs"><span class="text-ink-500 w-8">卷'+vp.id+'</span><div class="flex-1 bg-ink-200 rounded-full h-1"><div class="'+stColor+' h-1 rounded-full" style="width:'+p+'%"></div></div><span class="text-ink-400 w-12 text-right">'+vp.written+'/'+vp.total+'</span></div>';
    }).join('');
    document.getElementById('volume-progress').innerHTML = volHtml;
  } catch(e) { /* 进度加载失败不影响使用 */ }
}

// 模型
async function loadModels() {
  try {
    const res = await fetch(OPENAI_API + '/models');
    const data = await res.json();
    const sel = document.getElementById('model-select');
    sel.innerHTML = '';
    state.models = data.data || [];
    if (state.models.length === 0) { sel.innerHTML = '<option value="">无可用模型</option>'; return; }
    state.models.forEach(function(m) { const opt = document.createElement('option'); opt.value = m.id; opt.textContent = m.name || m.id; sel.appendChild(opt); });
    state.currentModel = state.models[0].id;
    updateModelDesc();
  } catch(e) { document.getElementById('model-select').innerHTML = '<option value="">加载失败</option>'; }
}
function updateModelDesc() {
  const m = state.models.find(function(x){ return x.id === state.currentModel; });
  document.getElementById('model-desc').textContent = (m && m.description) || '选择助手模型开始创作';
}
document.getElementById('model-select').addEventListener('change', function(e) { state.currentModel = e.target.value; updateModelDesc(); });

// 对话
const chatBox = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'fade-in flex ' + (role === 'user' ? 'justify-end' : 'justify-start');
  const inner = document.createElement('div');
  inner.className = (role === 'user' ? 'msg-user' : 'msg-ai') + ' rounded-lg p-4 max-w-3xl text-sm leading-relaxed';
  inner.innerHTML = role === 'user' ? escapeHtml(text).replace(/\n/g, '<br>') : renderMarkdown(text);
  div.appendChild(inner); chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
  return inner;
}
function addStreamingMessage() {
  const div = document.createElement('div');
  div.className = 'fade-in flex justify-start';
  div.innerHTML = '<div class="msg-ai rounded-lg p-4 max-w-3xl text-sm leading-relaxed streaming-cursor" id="streaming-msg"></div>';
  chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
  return document.getElementById('streaming-msg');
}
function addTyping() {
  const div = document.createElement('div');
  div.id = 'typing-indicator'; div.className = 'flex justify-start fade-in';
  div.innerHTML = '<div class="msg-ai rounded-lg p-4 max-w-3xl"><div class="flex gap-1 items-center"><span class="text-xs text-ink-400 mr-2">正在思考</span><span class="typing-dot w-2 h-2 bg-ink-400 rounded-full"></span><span class="typing-dot w-2 h-2 bg-ink-400 rounded-full"></span><span class="typing-dot w-2 h-2 bg-ink-400 rounded-full"></span></div></div>';
  chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  if (!state.currentModel) { toast('请先选择模型', 'warn'); return; }
  state.messages.push({ role: 'user', content: text });
  addMessage('user', text);
  chatInput.value = ''; sendBtn.disabled = true; addTyping();
  let streamEl = null; let fullText = '';
  try {
    const res = await fetch(OPENAI_API + '/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: state.currentModel, messages: state.messages, stream: true })
    });
    const typing = document.getElementById('typing-indicator'); if (typing) typing.remove();
    if (!res.ok) {
      const err = await res.json().catch(function(){ return { error: { message: res.statusText } }; });
      addMessage('assistant', '## ❌ 请求失败\n\n```\n' + (err.error?.message || JSON.stringify(err)) + '\n```');
      state.messages.pop(); return;
    }
    const reader = res.body.getReader(); const decoder = new TextDecoder(); let buffer = '';
    streamEl = addStreamingMessage();
    while (true) {
      const chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, { stream: true });
      const lines = buffer.split('\n'); buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try { const json = JSON.parse(data); const delta = json.choices?.[0]?.delta?.content; if (delta) { fullText += delta; streamEl.innerHTML = renderMarkdown(fullText); chatBox.scrollTop = chatBox.scrollHeight; } } catch(e) {}
      }
    }
    if (streamEl) streamEl.classList.remove('streaming-cursor');
    if (!fullText && streamEl) streamEl.innerHTML = '<span class="text-ink-400">(空响应)</span>';
    state.messages.push({ role: 'assistant', content: fullText });
  } catch(e) {
    const typing = document.getElementById('typing-indicator'); if (typing) typing.remove();
    if (streamEl) { streamEl.classList.remove('streaming-cursor'); if (!fullText) streamEl.remove(); }
    addMessage('assistant', '## ❌ 网络错误\n\n```\n' + e.message + '\n```');
    state.messages.pop(); toast('网络错误: ' + e.message, 'error');
  } finally { sendBtn.disabled = false; chatInput.focus(); }
}
sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
document.getElementById('clear-chat').addEventListener('click', async function() {
  if (state.messages.length === 0) return;
  const ok = await confirmDialog('清空对话', '确定清空所有对话历史？');
  if (!ok) return;
  state.messages = [];
  chatBox.innerHTML = '<div class="msg-ai rounded-lg p-5 max-w-3xl mx-auto fade-in"><p class="text-sm text-ink-700 leading-relaxed"><span class="font-brush text-vermilion-600 text-xl">對話已清空。</span> 開始新的創作吧。</p></div>';
  toast('对话已清空', 'success');
});

// 卷宗
async function loadVolumes() {
  const list = document.getElementById('volumes-list');
  list.innerHTML = skeletonCard() + skeletonCard();
  try {
    const vols = await api('/volumes');
    state.volumes = vols;
    const vf = document.getElementById('volume-filter');
    vf.innerHTML = '<option value="">全部卷</option>' + vols.map(function(v){ return '<option value="'+v.id+'">卷'+v.id+' '+escapeHtml(v.name)+'</option>'; }).join('');
    if (vols.length === 0) {
      list.innerHTML = '<div class="text-center py-16"><div class="text-4xl mb-3">📜</div><p class="text-ink-400 mb-4">还没有卷</p><button onclick="openVolumeModal()" class="bg-vermilion-500 hover:bg-vermilion-600 text-white px-4 py-2 rounded-md text-sm">创建第一卷</button></div>';
      return;
    }
    const statusMap = { completed: '✅ 已完成', active: '🔵 进行中', planned: '⚪ 规划中' };
    const statusColor = { completed: 'text-bamboo-600 bg-bamboo-500/10', active: 'text-ink-700 bg-ink-500/10', planned: 'text-ink-400 bg-ink-100' };
    list.innerHTML = vols.map(function(v) {
      const chCount = v.chapter_end - v.chapter_start + 1;
      return '<div class="paper-bg border border-ink-200 rounded-lg p-5 hover:shadow-md transition cursor-pointer" onclick="openVolumeModal('+v.id+')"><div class="flex items-start justify-between"><div class="flex-1 min-w-0"><div class="flex items-center gap-3 mb-2"><span class="seal text-sm">卷'+v.id+'</span><h3 class="font-xiaowei text-lg text-ink-900 truncate">'+escapeHtml(v.name)+'</h3></div><p class="text-sm text-ink-600 mb-3 line-clamp-2">'+escapeHtml(v.summary || '暂无摘要')+'</p><div class="flex items-center gap-3 flex-wrap"><span class="text-xs text-ink-500 bg-ink-50 px-2 py-1 rounded">📄 第 '+v.chapter_start+'-'+v.chapter_end+' 章</span><span class="text-xs text-ink-500 bg-ink-50 px-2 py-1 rounded">📝 '+chCount+' 章</span><span class="text-xs px-2 py-1 rounded cursor-pointer '+(statusColor[v.status]||statusColor.planned)+'" onclick="event.stopPropagation(); cycleVolumeStatus('+v.id+', \''+v.status+'\')">'+(statusMap[v.status]||v.status)+'</span></div></div><button onclick="event.stopPropagation(); confirmDeleteVolume('+v.id+', \''+escapeHtml(v.name).replace(/'/g,"\\'")+'\')" class="text-ink-400 hover:text-vermilion-600 text-sm px-2 ml-2">删</button></div></div>';
    }).join('');
  } catch(e) { list.innerHTML = '<div class="text-center text-vermilion-600 py-12">加载失败: '+escapeHtml(e.message)+'</div>'; }
}

window.openVolumeModal = function(volId) {
  const vol = volId ? state.volumes.find(function(v){ return v.id === volId; }) : null;
  const isEdit = !!vol;
  showModal('<div class="p-6"><h3 class="font-bold text-lg text-ink-900 mb-4">'+(isEdit?'编辑卷':'新建卷')+'</h3><div class="space-y-4"><div><label class="text-xs text-ink-500 block mb-1">卷名 *</label><input id="vol-name" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white" value="'+(vol?escapeHtml(vol.name):'')+'" placeholder="例：功德币风云"></div><div class="grid grid-cols-2 gap-3"><div><label class="text-xs text-ink-500 block mb-1">起始章 *</label><input id="vol-start" type="number" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white" value="'+(vol?vol.chapter_start:1)+'"></div><div><label class="text-xs text-ink-500 block mb-1">结束章 *</label><input id="vol-end" type="number" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white" value="'+(vol?vol.chapter_end:30)+'"></div></div><div><label class="text-xs text-ink-500 block mb-1">摘要</label><textarea id="vol-summary" rows="3" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white resize-none" placeholder="本卷主要情节...">'+(vol?escapeHtml(vol.summary):'')+'</textarea></div>'+(isEdit?'<div><label class="text-xs text-ink-500 block mb-1">状态</label><select id="vol-status" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white"><option value="planned" '+(vol.status==='planned'?'selected':'')+'>⚪ 规划中</option><option value="active" '+(vol.status==='active'?'selected':'')+'>🔵 进行中</option><option value="completed" '+(vol.status==='completed'?'selected':'')+'>✅ 已完成</option></select></div>':'')+'</div><div class="flex justify-end gap-3 mt-6"><button onclick="closeModal()" class="px-4 py-2 text-sm text-ink-600 hover:bg-ink-100 rounded">取消</button><button id="save-vol-btn" class="px-4 py-2 text-sm bg-vermilion-500 hover:bg-vermilion-600 text-white rounded">'+(isEdit?'保存':'创建')+'</button></div></div>');
  document.getElementById('save-vol-btn').addEventListener('click', async function() {
    const name = document.getElementById('vol-name').value.trim();
    const start = parseInt(document.getElementById('vol-start').value);
    const end = parseInt(document.getElementById('vol-end').value);
    const summary = document.getElementById('vol-summary').value.trim();
    if (!name) { toast('请填卷名', 'warn'); return; }
    if (!start || !end || start > end) { toast('章节范围有误', 'warn'); return; }
    try {
      if (isEdit) {
        const status = document.getElementById('vol-status').value;
        await api('/volumes/'+volId, { method: 'PUT', body: JSON.stringify({ name: name, chapter_start: start, chapter_end: end, summary: summary, status: status }) });
        toast('卷已更新', 'success');
      } else {
        await api('/volumes', { method: 'POST', body: JSON.stringify({ name: name, chapter_start: start, chapter_end: end, summary: summary }) });
        toast('卷已创建', 'success');
      }
      closeModal(); loadVolumes();
    } catch(e) { toast('保存失败: ' + e.message, 'error'); }
  });
};
window.confirmDeleteVolume = async function(id, name) {
  const ok = await confirmDialog('删除卷', '确认删除「'+name+'」？此操作不可撤销。');
  if (!ok) return;
  try { await api('/volumes/'+id, { method: 'DELETE' }); toast('已删除', 'success'); loadVolumes(); }
  catch(e) { toast('删除失败: ' + e.message, 'error'); }
};
window.cycleVolumeStatus = async function(id, current) {
  const next = { planned: 'active', active: 'completed', completed: 'planned' }[current] || 'planned';
  try { await api('/volumes/'+id, { method: 'PUT', body: JSON.stringify({ status: next }) }); loadVolumes(); toast('状态已更新', 'success', 1500); }
  catch(e) { toast('更新失败: ' + e.message, 'error'); }
};
document.getElementById('new-volume-btn').addEventListener('click', function() { openVolumeModal(); });

// 章节
async function loadChapters() {
  const list = document.getElementById('chapters-list');
  list.innerHTML = Array(6).fill(skeletonCard()).join('');
  const start = state.chapterRange.start, end = state.chapterRange.end;
  const volParam = state.volumeFilter ? '&volume_id='+state.volumeFilter : '';
  try {
    const data = await api('/chapters?start='+start+'&end='+end+volParam);
    let chapters = data.chapters || [];
    if (state.chapterSearch) chapters = chapters.filter(function(c){ return c.title && c.title.includes(state.chapterSearch); });
    document.getElementById('chapter-count').textContent = '共 '+data.total+' 章'+(state.volumeFilter?'（当前卷）':'');
    document.getElementById('page-info').textContent = start+'-'+end;
    if (chapters.length === 0) { list.innerHTML = '<div class="text-center py-16 col-span-full"><div class="text-4xl mb-3">📭</div><p class="text-ink-400">该范围无章节</p></div>'; return; }
    const emotionColor = { '紧张':'border-vermilion-500', '悲伤':'border-ink-400', '轻松':'border-bamboo-500', '兴奋':'border-gold-500', '愤怒':'border-vermilion-600', '温馨':'border-gold-400' };
    const emotionBg = { '紧张':'bg-vermilion-500/10', '悲伤':'bg-ink-400/10', '轻松':'bg-bamboo-500/10', '兴奋':'bg-gold-500/10' };
    list.innerHTML = chapters.map(function(ch) {
      return '<div class="chapter-card paper-bg border-l-4 '+(emotionColor[ch.emotion]||'border-ink-300')+' border-y border-r border-ink-200 rounded p-4" onclick="showChapterDetail('+ch.chapter_num+')"><div class="flex items-baseline justify-between mb-1"><span class="font-brush text-vermilion-700 text-lg">第'+ch.chapter_num+'章</span>'+(ch.volume_id?'<span class="text-xs text-ink-400 bg-ink-50 px-1.5 py-0.5 rounded">卷'+ch.volume_id+'</span>':'')+'</div><h4 class="text-sm font-medium text-ink-800 line-clamp-2 mb-2">'+escapeHtml(ch.title)+'</h4>'+(ch.key_events&&ch.key_events.length?'<div class="text-xs text-ink-500 line-clamp-2 mb-2">📌 '+escapeHtml(ch.key_events.slice(0,2).join('；'))+'</div>':'')+'<div class="text-xs text-ink-400 flex gap-3"><span>📊 '+ch.word_count+'字</span>'+(ch.emotion?'<span class="'+(emotionBg[ch.emotion]||'')+' px-1.5 rounded">🎭 '+escapeHtml(ch.emotion)+'</span>':'')+'</div></div>';
    }).join('');
  } catch(e) { list.innerHTML = '<div class="text-center text-vermilion-600 py-12 col-span-full">加载失败: '+escapeHtml(e.message)+'</div>'; }
}
window.showChapterDetail = async function(chNum) {
  try {
    const ch = await api('/chapters/'+chNum);
    const metaHtml = '<div class="text-xs text-ink-500 flex gap-4 mb-4 pb-3 border-b border-ink-100 flex-wrap"><span>📊 '+ch.word_count+'字</span>'+(ch.emotion?'<span>🎭 '+escapeHtml(ch.emotion)+'</span>':'')+(ch.volume_id?'<span>📖 卷'+ch.volume_id+'</span>':'')+'</div>'+(ch.summary?'<div class="bg-ink-50 rounded p-3 mb-4 text-sm text-ink-700"><b>摘要：</b>'+escapeHtml(ch.summary)+'</div>':'')+(ch.key_events&&ch.key_events.length?'<div class="mb-4 text-sm"><b class="text-ink-700">关键事件：</b><ul class="mt-1 text-ink-600">'+ch.key_events.map(function(e){ return '<li>• '+escapeHtml(e)+'</li>'; }).join('')+'</ul></div>':'');
    const contentHtml = '<div id="ch-content-view" class="text-ink-800 leading-relaxed whitespace-pre-wrap text-sm">'+(escapeHtml(ch.content)||'<span class="text-ink-400">（无正文）</span>')+'</div>';
    const editHtml = '<div id="ch-content-edit" class="hidden"><textarea id="ch-edit-area" class="ink-input w-full border border-ink-300 rounded p-3 text-sm bg-white resize-none font-serif" style="min-height:400px">'+escapeHtml(ch.content)+'</textarea></div>';
    const versionHtml = '<div id="ch-versions-panel" class="hidden mt-4 pt-4 border-t border-ink-100"><div class="flex items-center justify-between mb-2"><span class="text-xs font-medium text-ink-700">版本历史</span><button id="refresh-versions-btn" class="text-xs text-ink-500 hover:text-vermilion-600">刷新</button></div><div id="ch-versions-list" class="space-y-1 max-h-40 overflow-y-auto scrollbar"></div></div>';
    showModal('<div class="flex flex-col max-h-[85vh]"><div class="px-6 py-4 border-b border-ink-200 flex items-center justify-between"><div><h3 class="font-brush text-2xl text-vermilion-700">第'+ch.chapter_num+'章</h3><p class="text-sm text-ink-600 mt-1">'+escapeHtml(ch.title)+'</p></div><div class="flex items-center gap-2"><button id="ch-edit-btn" class="text-xs bg-ink-100 hover:bg-ink-200 text-ink-700 px-2 py-1 rounded">编辑</button><button id="ch-versions-btn" class="text-xs bg-ink-100 hover:bg-ink-200 text-ink-700 px-2 py-1 rounded">版本</button><button onclick="closeModal()" class="text-ink-400 hover:text-vermilion-600 text-xl ml-1">×</button></div></div><div class="px-6 py-4 overflow-y-auto scrollbar flex-1" id="ch-detail-body">'+metaHtml+contentHtml+editHtml+versionHtml+'</div><div id="ch-edit-actions" class="hidden px-6 py-3 border-t border-ink-200 flex justify-end gap-2 bg-ink-50"><button id="ch-cancel-edit-btn" class="text-xs text-ink-600 hover:bg-ink-100 px-3 py-2 rounded">取消</button><button id="ch-save-btn" class="text-xs bg-vermilion-500 hover:bg-vermilion-600 text-white px-3 py-2 rounded">保存新版本</button></div></div>', true);

    // 编辑模式切换
    document.getElementById('ch-edit-btn').addEventListener('click', function() {
      const view = document.getElementById('ch-content-view');
      const edit = document.getElementById('ch-content-edit');
      const actions = document.getElementById('ch-edit-actions');
      const btn = this;
      if (edit.classList.contains('hidden')) {
        view.classList.add('hidden'); edit.classList.remove('hidden'); actions.classList.remove('hidden');
        btn.textContent = '退出编辑'; btn.classList.add('bg-vermilion-100');
        document.getElementById('ch-edit-area').focus();
      } else {
        view.classList.remove('hidden'); edit.classList.add('hidden'); actions.classList.add('hidden');
        btn.textContent = '编辑'; btn.classList.remove('bg-vermilion-100');
      }
    });

    // 保存新版本
    document.getElementById('ch-save-btn').addEventListener('click', async function() {
      const newContent = document.getElementById('ch-edit-area').value;
      if (!newContent.trim()) { toast('内容不能为空', 'warn'); return; }
      const ok = await confirmDialog('保存新版本', '当前正文将备份为历史版本，确定保存？');
      if (!ok) return;
      try {
        const res = await api('/chapters/'+chNum+'/content', { method: 'POST', body: JSON.stringify({ content: newContent }) });
        toast('已保存（版本 v'+res.version+'）', 'success');
        closeModal();
        showChapterDetail(chNum); // 重新打开刷新
      } catch(e) { toast('保存失败: ' + e.message, 'error'); }
    });

    document.getElementById('ch-cancel-edit-btn').addEventListener('click', function() {
      document.getElementById('ch-content-view').classList.remove('hidden');
      document.getElementById('ch-content-edit').classList.add('hidden');
      document.getElementById('ch-edit-actions').classList.add('hidden');
      document.getElementById('ch-edit-btn').textContent = '编辑';
      document.getElementById('ch-edit-btn').classList.remove('bg-vermilion-100');
    });

    // 版本历史
    async function loadVersions() {
      const listEl = document.getElementById('ch-versions-list');
      listEl.innerHTML = '<div class="text-xs text-ink-400">加载中...</div>';
      try {
        const data = await api('/chapters/'+chNum+'/versions');
        const versions = data.versions || [];
        const current = data.current || {};
        let html = '';
        if (current.version) {
          html += '<div class="flex items-center justify-between text-xs px-2 py-1.5 bg-vermilion-500/10 rounded"><span class="text-vermilion-700">● 当前 v'+current.version+' ('+current.size+'字)</span></div>';
        }
        if (versions.length === 0) {
          html += '<div class="text-xs text-ink-400 text-center py-2">无历史版本</div>';
        } else {
          versions.slice().reverse().forEach(function(v) {
            html += '<div class="flex items-center justify-between text-xs px-2 py-1.5 hover:bg-ink-50 rounded"><span class="text-ink-600">v'+v.version+' ('+v.size+'字)</span><button data-ver="'+v.version+'" class="restore-ver-btn text-vermilion-600 hover:underline">回滚</button></div>';
          });
        }
        listEl.innerHTML = html;
        listEl.querySelectorAll('.restore-ver-btn').forEach(function(btn) {
          btn.addEventListener('click', async function() {
            const ver = parseInt(this.dataset.ver);
            const ok = await confirmDialog('回滚版本', '确定回滚到 v'+ver+'？当前正文将备份为新版本。');
            if (!ok) return;
            try {
              await api('/chapters/'+chNum+'/restore', { method: 'POST', body: JSON.stringify({ version: ver }) });
              toast('已回滚到 v'+ver, 'success');
              closeModal();
              showChapterDetail(chNum);
            } catch(e) { toast('回滚失败: ' + e.message, 'error'); }
          });
        });
      } catch(e) { listEl.innerHTML = '<div class="text-xs text-vermilion-600">加载失败</div>'; }
    }

    document.getElementById('ch-versions-btn').addEventListener('click', function() {
      const panel = document.getElementById('ch-versions-panel');
      if (panel.classList.contains('hidden')) {
        panel.classList.remove('hidden');
        this.classList.add('bg-vermilion-100');
        loadVersions();
      } else {
        panel.classList.add('hidden');
        this.classList.remove('bg-vermilion-100');
      }
    });
    document.getElementById('refresh-versions-btn').addEventListener('click', loadVersions);
  } catch(e) { toast('加载失败: ' + e.message, 'error'); }
};
document.getElementById('volume-filter').addEventListener('change', function(e) { state.volumeFilter = e.target.value; state.chapterRange = { start: 1, end: 50 }; loadChapters(); });
document.getElementById('chapter-search').addEventListener('input', function(e) { state.chapterSearch = e.target.value.trim(); loadChapters(); });
document.getElementById('prev-page').addEventListener('click', function() {
  if (state.chapterRange.start <= 1) { toast('已是第一页', 'info', 1500); return; }
  const start = Math.max(1, state.chapterRange.start - state.pageSize);
  state.chapterRange = { start: start, end: start + state.pageSize - 1 };
  loadChapters();
});
document.getElementById('next-page').addEventListener('click', function() {
  state.chapterRange = { start: state.chapterRange.end + 1, end: state.chapterRange.end + state.pageSize };
  loadChapters();
});

// 世界设定
async function loadSettings() {

// 关系图谱
let graphChart = null;
let graphData = null;
let relTypesCache = [];

async function loadGraph() {
  const canvas = document.getElementById('graph-canvas');
  if (!canvas) return;
  try {
    // 加载关系类型缓存（首次）
    if (relTypesCache.length === 0) {
      relTypesCache = await api('/relationships/types');
    }
    const data = await api('/graph');
    graphData = data;
    document.getElementById('graph-info').textContent = data.nodes.length + ' 个角色 · ' + data.edges.length + ' 条关系';
    renderGraph(data);
  } catch(e) {
    canvas.innerHTML = '<div class="flex items-center justify-center h-full text-vermilion-600 text-sm">加载失败: ' + escapeHtml(e.message) + '</div>';
  }
}

function renderGraph(data) {
  const canvas = document.getElementById('graph-canvas');
  if (!canvas || !window.echarts) return;
  if (graphChart) graphChart.dispose();
  graphChart = echarts.init(canvas);

  if (data.nodes.length === 0) {
    canvas.innerHTML = '<div class="flex items-center justify-center h-full text-ink-400 text-sm"><div class="text-center"><div class="text-4xl mb-3">🕸️</div><p>暂无关系数据</p><p class="text-xs mt-1">点击右上角「+ 新建关系」开始</p></div></div>';
    return;
  }

  const categoryColors = { positive: '#6b8e4e', neutral: '#8a7960', negative: '#c8453c' };
  const roleColors = { main: '#c8453c', support: '#ff7d00', villain: '#722ed1', minor: '#86909c', neutral: '#16599e' };

  const nodes = data.nodes.map(function(n) {
    const size = 30 + Math.min(n.relation_count * 6, 30);
    return {
      id: n.id, name: n.name,
      symbolSize: size,
      category: n.role_type || 'neutral',
      itemStyle: { color: roleColors[n.role_type] || '#8a7960', borderColor: '#fff', borderWidth: 2 },
      label: { show: true, position: 'bottom', fontSize: 12, color: '#261d16' },
      rawData: n,
    };
  });

  const edges = data.edges.map(function(e) {
    return {
      source: e.source, target: e.target,
      label: { show: false, formatter: e.rel_type, fontSize: 10, color: '#564636' },
      lineStyle: { color: categoryColors[e.category] || '#8a7960', width: 1 + e.intensity / 4, curveness: e.directed ? 0.2 : 0, opacity: 0.7 },
      symbol: e.directed ? ['none', 'arrow'] : ['none', 'none'],
      rawData: e,
    };
  });

  const categories = Object.keys(roleColors).map(function(k) { return { name: { main: '主角', support: '配角', villain: '反派', minor: '路人', neutral: '中立' }[k] || k }; });

  graphChart.setOption({
    tooltip: {
      formatter: function(p) {
        if (p.dataType === 'node') return '<b>' + p.data.name + '</b><br/>关系数: ' + (p.data.rawData ? p.data.rawData.relation_count : 0);
        if (p.dataType === 'edge' && p.data.rawData) return '<b>' + p.data.rawData.rel_type + '</b><br/>' + p.data.rawData.source + ' → ' + p.data.rawData.target;
        return '';
      }
    },
    legend: [{ data: categories.map(function(c) { return c.name; }), orient: 'vertical', right: 10, top: 20, textStyle: { fontSize: 11 } }],
    series: [{
      type: 'graph', layout: 'force',
      data: nodes, links: edges,
      roam: true, draggable: true,
      label: { show: true, fontSize: 12, position: 'bottom' },
      force: { repulsion: 300, edgeLength: [100, 250], gravity: 0.1 },
      emphasis: { focus: 'adjacency', lineStyle: { width: 4 }, label: { show: true } },
      lineStyle: { color: '#8a7960', opacity: 0.6, curveness: 0.2 },
    }]
  }, true);

  graphChart.off('click');
  graphChart.on('click', function(params) {
    if (params.dataType === 'node' && params.data.rawData) {
      showNodeDetail(params.data.rawData, data);
    } else if (params.dataType === 'edge' && params.data.rawData) {
      showEdgeDetail(params.data.rawData);
    }
  });

  window.addEventListener('resize', function() { if (graphChart) graphChart.resize(); });
}

function showNodeDetail(node, data) {
  const panel = document.getElementById('graph-detail');
  const content = document.getElementById('graph-detail-content');
  panel.classList.remove('hidden');
  // 找该节点的所有关系
  const rels = data.edges.filter(function(e) { return e.source === node.id || e.target === node.id; });
  const roleLabel = { main: '主角', support: '配角', villain: '反派', minor: '路人', neutral: '中立' }[node.role_type] || node.role_type || '-';
  let html = '<div class="flex items-center justify-between mb-3"><h3 class="font-xiaowei text-lg text-ink-900">' + escapeHtml(node.name) + '</h3><button onclick="document.getElementById(\'graph-detail\').classList.add(\'hidden\')" class="text-ink-400 hover:text-vermilion-600">×</button></div>';
  html += '<div class="text-xs text-ink-500 space-y-1 mb-4 pb-3 border-b border-ink-100"><div>🎭 定位: ' + escapeHtml(roleLabel) + '</div>' + (node.faction ? '<div>🏰 势力: ' + escapeHtml(node.faction) + '</div>' : '') + '<div>🔗 关系数: ' + node.relation_count + '</div></div>';
  if (rels.length > 0) {
    html += '<div class="text-xs font-medium text-ink-700 mb-2">关联关系</div><div class="space-y-1">';
    const catColor = { positive: 'text-bamboo-600 bg-bamboo-500/10', neutral: 'text-ink-600 bg-ink-100', negative: 'text-vermilion-600 bg-vermilion-500/10' };
    rels.forEach(function(r) {
      const other = r.source === node.id ? r.target : r.source;
      html += '<div class="flex items-center gap-2 text-xs p-1.5 hover:bg-ink-50 rounded cursor-pointer" onclick="showEdgeDetail(graphData.edges.find(function(e){return e.id==='+r.id+'}))"><span class="flex-1 text-ink-700">' + escapeHtml(other) + '</span><span class="px-1.5 py-0.5 rounded ' + (catColor[r.category]||catColor.neutral) + '">' + escapeHtml(r.rel_type) + '</span><span class="text-ink-400">' + (r.directed ? '→' : '↔') + '</span></div>';
    });
    html += '</div>';
  }
  content.innerHTML = html;
}

function showEdgeDetail(edge) {
  const panel = document.getElementById('graph-detail');
  const content = document.getElementById('graph-detail-content');
  panel.classList.remove('hidden');
  const catLabel = { positive: '友好', neutral: '中立', negative: '敌对' };
  const catColor = { positive: 'text-bamboo-600', neutral: 'text-ink-600', negative: 'text-vermilion-600' };

// 新建/编辑关系 Modal
window.openRelationshipModal = async function(relId) {
  const isEdit = !!relId;
  let r = {};
  if (isEdit) {
    try {
      const list = await api('/relationships');
      r = list.find(function(x) { return x.id === relId; }) || {};
    } catch(e) {}
  }
  // 加载角色名列表
  let charNames = [];
  try { const chars = await api('/characters'); charNames = chars.map(function(c) { return c.name; }); } catch(e) {}

  const typeOptions = relTypesCache.map(function(t) { return '<option value="' + escapeHtml(t.type_name) + '" data-cat="' + t.category + '" data-dir="' + (t.directed ? '1' : '0') + '"' + (r.rel_type === t.type_name ? ' selected' : '') + '>' + t.icon + ' ' + escapeHtml(t.type_name) + ' (' + {positive:'友好',neutral:'中立',negative:'敌对'}[t.category] + ')</option>'; }).join('');

  showModal('<div class="p-6"><h3 class="font-bold text-lg text-ink-900 mb-4">' + (isEdit ? '编辑关系' : '新建关系') + '</h3><div class="space-y-4"><div class="grid grid-cols-2 gap-3"><div><label class="text-xs text-ink-500 block mb-1">源角色 *</label><select id="rel-source" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white">' + charNames.map(function(n) { return '<option value="' + escapeHtml(n) + '"' + (r.source_name === n ? ' selected' : '') + '>' + escapeHtml(n) + '</option>'; }).join('') + '</select></div><div><label class="text-xs text-ink-500 block mb-1">目标角色 *</label><select id="rel-target" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white">' + charNames.map(function(n) { return '<option value="' + escapeHtml(n) + '"' + (r.target_name === n ? ' selected' : '') + '>' + escapeHtml(n) + '</option>'; }).join('') + '</select></div></div><div><label class="text-xs text-ink-500 block mb-1">关系类型</label><select id="rel-type" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white">' + typeOptions + '</select></div><div class="grid grid-cols-3 gap-3"><div><label class="text-xs text-ink-500 block mb-1">性质</label><select id="rel-cat" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white"><option value="positive"' + (r.category === 'positive' ? ' selected' : '') + '>友好</option><option value="neutral"' + (r.category === 'neutral' ? ' selected' : '') + '>中立</option><option value="negative"' + (r.category === 'negative' ? ' selected' : '') + '>敌对</option></select></div><div><label class="text-xs text-ink-500 block mb-1">方向</label><select id="rel-dir" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white"><option value="0"' + (!r.directed ? ' selected' : '') + '>双向</option><option value="1"' + (r.directed ? ' selected' : '') + '>单向</option></select></div><div><label class="text-xs text-ink-500 block mb-1">强度 (1-10)</label><input id="rel-int" type="number" min="1" max="10" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white" value="' + (r.intensity || 5) + '"></div></div><div class="grid grid-cols-2 gap-3"><div><label class="text-xs text-ink-500 block mb-1">起始章</label><input id="rel-start" type="number" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white" value="' + (r.start_chapter || 0) + '"></div><div><label class="text-xs text-ink-500 block mb-1">结束章</label><input id="rel-end" type="number" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white" value="' + (r.end_chapter || 0) + '"></div></div><div><label class="text-xs text-ink-500 block mb-1">描述</label><input id="rel-desc" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white" value="' + escapeHtml(r.description || '') + '"></div></div><div class="flex justify-end gap-3 mt-6"><button onclick="closeModal()" class="px-4 py-2 text-sm text-ink-600 hover:bg-ink-100 rounded">取消</button><button id="save-rel-btn" class="px-4 py-2 text-sm bg-vermilion-500 hover:bg-vermilion-600 text-white rounded">' + (isEdit ? '保存' : '创建') + '</button></div></div>', true);

  // 关系类型变化时自动更新性质和方向
  document.getElementById('rel-type').addEventListener('change', function() {
    const opt = this.options[this.selectedIndex];
    document.getElementById('rel-cat').value = opt.dataset.cat;
    document.getElementById('rel-dir').value = opt.dataset.dir;
  });

  document.getElementById('save-rel-btn').addEventListener('click', async function() {
    const body = {
      source_name: document.getElementById('rel-source').value,
      target_name: document.getElementById('rel-target').value,
      rel_type: document.getElementById('rel-type').value,
      category: document.getElementById('rel-cat').value,
      directed: document.getElementById('rel-dir').value === '1',
      intensity: parseInt(document.getElementById('rel-int').value) || 5,
      start_chapter: parseInt(document.getElementById('rel-start').value) || 0,
      end_chapter: parseInt(document.getElementById('rel-end').value) || 0,
      description: document.getElementById('rel-desc').value,
    };
    if (!body.source_name || !body.target_name) { toast('请选择源角色和目标角色', 'warn'); return; }
    if (body.source_name === body.target_name) { toast('源角色和目标角色不能相同', 'warn'); return; }
    try {
      if (isEdit) { await api('/relationships/' + relId, { method: 'PUT', body: JSON.stringify(body) }); toast('关系已更新', 'success'); }
      else { await api('/relationships', { method: 'POST', body: JSON.stringify(body) }); toast('关系已创建', 'success'); }
      closeModal();
      loadGraph();
    } catch(e) { toast('保存失败: ' + e.message, 'error'); }
  });
};

async function loadGenContext() {
  const chNum = parseInt(document.getElementById('gen-ch-num').value);
  if (!chNum) { toast('请输入章节号', 'warn'); return; }
  const preview = document.getElementById('ctx-preview');
  preview.classList.remove('hidden');
  preview.innerHTML = '<div class="skeleton h-4 w-full mb-2"></div><div class="skeleton h-4 w-3/4 mb-2"></div><div class="skeleton h-4 w-1/2"></div>';
  try {
    const ctx = await api('/chapters/'+chNum+'/context');
    let html = '';
    // 预检结果（强制信息收集）
    try {
      const check = await api('/generate/check?chapter_num='+chNum+'&beat=&emotion=&characters=');
      if (check.passed) {
        html += '<div class="bg-bamboo-500/10 border border-bamboo-500/30 rounded p-2 flex items-center gap-2 text-xs"><span class="text-bamboo-600 font-bold">✓</span><span class="text-bamboo-700">预检通过 — 信息齐全，可以生成</span></div>';
      } else {
        html += '<div class="bg-vermilion-500/10 border border-vermilion-500/30 rounded p-3"><div class="text-xs font-bold text-vermilion-700 mb-1">❌ 预检未通过 — 以下信息缺失：</div><ul class="text-xs text-vermilion-600 space-y-0.5 list-disc list-inside">';
        check.missing_items.forEach(function(item) { html += '<li>'+escapeHtml(item)+'</li>'; });
        html += '</ul></div>';
        // 阻断生成按钮
        state.genBlocked = true;
      }
      if (check.warnings && check.warnings.length) {
        html += '<div class="bg-gold-500/10 border border-gold-500/30 rounded p-2"><div class="text-xs font-medium text-gold-700 mb-1">⚠️ 警告</div><ul class="text-xs text-gold-700 space-y-0.5 list-disc list-inside">';
        check.warnings.forEach(function(w) { html += '<li>'+escapeHtml(w)+'</li>'; });
        html += '</ul></div>';
      }
      if (check.context_hints && check.context_hints.length) {
        html += '<div class="bg-ink-50 border border-ink-200 rounded p-2"><div class="text-xs font-medium text-ink-700 mb-1">💡 提示</div><ul class="text-xs text-ink-600 space-y-0.5 list-disc list-inside">';
        check.context_hints.forEach(function(h) { html += '<li>'+escapeHtml(h)+'</li>'; });
        html += '</ul></div>';
      }
    } catch(e) { /* 预检失败不阻断，继续显示上下文 */ }

    if (ctx.volume_id) html += '<div class="text-xs"><span class="bg-ink-100 text-ink-700 px-2 py-1 rounded">📖 卷'+ctx.volume_id+'</span></div>';
    if (ctx.arc_direction) html += '<details class="border border-ink-200 rounded"><summary class="text-xs font-medium text-ink-700 px-3 py-2 cursor-pointer hover:bg-ink-50">🧭 故事方向</summary><div class="px-3 py-2 text-xs text-ink-600 whitespace-pre-wrap border-t border-ink-100">'+escapeHtml(ctx.arc_direction)+'</div></details>';
    if (ctx.character_snapshots) html += '<details class="border border-ink-200 rounded"><summary class="text-xs font-medium text-ink-700 px-3 py-2 cursor-pointer hover:bg-ink-50">🎭 角色状态</summary><div class="px-3 py-2 text-xs text-ink-600 whitespace-pre-wrap border-t border-ink-100">'+escapeHtml(ctx.character_snapshots)+'</div></details>';
    if (ctx.due_foreshadows) html += '<details class="border border-vermilion-500/30 rounded"><summary class="text-xs font-medium text-vermilion-700 px-3 py-2 cursor-pointer hover:bg-vermilion-500/5">🪤 到期伏笔提醒</summary><div class="px-3 py-2 text-xs text-ink-600 whitespace-pre-wrap border-t border-vermilion-500/20">'+escapeHtml(ctx.due_foreshadows)+'</div></details>';
    if (ctx.constraints) html += '<details class="border border-ink-200 rounded"><summary class="text-xs font-medium text-ink-700 px-3 py-2 cursor-pointer hover:bg-ink-50">⚠️ 本章约束</summary><div class="px-3 py-2 text-xs text-ink-600 whitespace-pre-wrap border-t border-ink-100">'+escapeHtml(ctx.constraints)+'</div></details>';
    if (ctx.last_300_words) html += '<details class="border border-ink-200 rounded"><summary class="text-xs font-medium text-ink-700 px-3 py-2 cursor-pointer hover:bg-ink-50">📜 上一章收尾（300字）</summary><div class="px-3 py-2 text-xs text-ink-600 whitespace-pre-wrap border-t border-ink-100">'+escapeHtml(ctx.last_300_words)+'</div></details>';
    if (ctx.recent_chapters_full) html += '<details class="border border-ink-200 rounded"><summary class="text-xs font-medium text-ink-700 px-3 py-2 cursor-pointer hover:bg-ink-50">📚 前3章原文（'+ctx.recent_chars_count+'字，预览2000字）</summary><div class="px-3 py-2 text-xs text-ink-600 whitespace-pre-wrap border-t border-ink-100 max-h-60 overflow-y-auto scrollbar">'+escapeHtml(ctx.recent_chapters_full)+'</div></details>';
    if (!html) html = '<div class="text-xs text-ink-400 text-center py-4">无可用上下文</div>';
    preview.innerHTML = html;
    document.getElementById('gen-input-area').classList.remove('hidden');
    // 预检通过才启用生成按钮
    const genBtn = document.getElementById('run-gen-btn');
    if (state.genBlocked) {
      genBtn.disabled = true;
      genBtn.classList.add('opacity-50', 'cursor-not-allowed');
      genBtn.textContent = '预检未通过，无法生成';
    } else {
      genBtn.disabled = false;
      genBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      genBtn.textContent = '开始生成';
    }
    toast('上下文已加载', 'success', 1500);
  } catch(e) {
    preview.innerHTML = '<div class="text-xs text-vermilion-600">加载失败: '+escapeHtml(e.message)+'</div>';
  }
}

async function runSmartGenerate() {
  if (state.genBlocked) { toast('预检未通过，请先补全缺失信息', 'warn'); return; }
  const chNum = parseInt(document.getElementById('gen-ch-num').value);
  const beat = document.getElementById('gen-beat').value.trim();
  const emotion = document.getElementById('gen-emotion').value;
  if (!chNum) { toast('请输入章节号', 'warn'); return; }
  if (!beat) { toast('请输入节拍', 'warn'); return; }

  const resultArea = document.getElementById('gen-result-area');
  resultArea.classList.remove('hidden');
  resultArea.innerHTML = '<div class="bg-ink-50 rounded-lg p-4"><div class="flex items-center gap-2 text-sm text-ink-600 mb-2"><span class="typing-dot w-2 h-2 bg-vermilion-500 rounded-full"></span><span class="typing-dot w-2 h-2 bg-vermilion-500 rounded-full"></span><span class="typing-dot w-2 h-2 bg-vermilion-500 rounded-full"></span><span>正在生成第 '+chNum+' 章...</span></div><div id="gen-stream" class="text-xs text-ink-500"></div></div>';

  const streamEl = document.getElementById('gen-stream');
  const inputArea = document.getElementById('gen-input-area');
  inputArea.classList.add('hidden');

  let fullText = '';
  try {
    const res = await fetch(OPENAI_API + '/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'moliu-chapter-generator',
        messages: [{ role: 'user', content: '生成第'+chNum+'章\n节拍：'+beat+'\n情绪：'+emotion }],
        stream: true
      })
    });
    if (!res.ok) {
      const err = await res.json().catch(function(){ return { error: { message: res.statusText } }; });
      resultArea.innerHTML = '<div class="bg-vermilion-500/10 border border-vermilion-500/30 rounded-lg p-4 text-sm text-vermilion-700">❌ 生成失败: '+(err.error?.message||JSON.stringify(err))+'</div>';
      inputArea.classList.remove('hidden');
      return;
    }
    const reader = res.body.getReader(); const decoder = new TextDecoder(); let buffer = '';
    while (true) {
      const chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, { stream: true });
      const lines = buffer.split('\n'); buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try { const json = JSON.parse(data); const delta = json.choices?.[0]?.delta?.content; if (delta) { fullText += delta; streamEl.innerHTML = renderMarkdown(fullText); resultArea.scrollTop = resultArea.scrollHeight; } } catch(e) {}
      }
    }
    // 生成完成，显示完整结果 + 操作按钮
    resultArea.innerHTML = '<div class="bg-white border border-ink-200 rounded-lg p-4"><div class="flex items-center justify-between mb-3 pb-2 border-b border-ink-100"><span class="text-sm font-medium text-ink-700">✅ 第'+chNum+'章生成完成</span><div class="flex gap-2"><button id="copy-result-btn" class="text-xs bg-ink-100 hover:bg-ink-200 text-ink-700 px-2 py-1 rounded">复制</button><button id="close-after-gen-btn" class="text-xs bg-vermilion-100 hover:bg-vermilion-200 text-vermilion-700 px-2 py-1 rounded">关闭</button></div></div><div class="text-sm text-ink-800 max-h-96 overflow-y-auto scrollbar">'+renderMarkdown(fullText)+'</div></div>';
    document.getElementById('copy-result-btn').addEventListener('click', function() { navigator.clipboard.writeText(fullText); toast('已复制到剪贴板', 'success', 1500); });
    document.getElementById('close-after-gen-btn').addEventListener('click', closeModal);
    toast('章节生成完成', 'success');
  } catch(e) {
    resultArea.innerHTML = '<div class="bg-vermilion-500/10 border border-vermilion-500/30 rounded-lg p-4 text-sm text-vermilion-700">❌ 网络错误: '+escapeHtml(e.message)+'</div>';
    inputArea.classList.remove('hidden');
  }
}
