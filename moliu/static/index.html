<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨流 · 小说创作工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        serif: ['"Noto Serif SC"', 'serif'],
        brush: ['"Ma Shan Zheng"', 'cursive'],
        xiaowei: ['"ZCOOL XiaoWei"', 'serif'],
      },
      colors: {
        ink: {
          50: '#f7f5f2', 100: '#ede8e1', 200: '#dcd3c7',
          300: '#c4b8a7', 400: '#a89880', 500: '#8a7960',
          600: '#6f5e4a', 700: '#564636', 800: '#3d3025', 900: '#261d16',
          950: '#17110c',
        },
        vermilion: { 400: '#d65650', 500: '#c8453c', 600: '#a8392f', 700: '#8a2d26' },
        bamboo: { 400: '#7da35e', 500: '#6b8e4e', 600: '#557340' },
        gold: { 400: '#d9bd7a', 500: '#c9a961', 600: '#a88a45' },
      },
    },
  },
};
</script>
<style>
  :root { --bg: #f7f5f2; --paper: #ffffff; --ink: #261d16; --ink-soft: #564636; --line: #dcd3c7; }
  * { -webkit-font-smoothing: antialiased; }
  body { font-family: 'Noto Serif SC', serif; background: var(--bg); color: var(--ink); }
  .font-brush { font-family: 'Ma Shan Zheng', cursive; }
  .font-xiaowei { font-family: 'ZCOOL XiaoWei', serif; }
  .paper-bg {
    background-color: var(--paper);
    background-image: radial-gradient(circle at 20% 30%, rgba(138,121,96,0.04) 0%, transparent 40%),
                      radial-gradient(circle at 80% 70%, rgba(138,121,96,0.03) 0%, transparent 40%);
  }
  .scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar::-webkit-scrollbar-thumb { background: #c4b8a7; border-radius: 3px; }
  .scrollbar::-webkit-scrollbar-track { background: transparent; }
  .seal {
    display: inline-flex; align-items: center; justify-content: center;
    background: #c8453c; color: #fff; font-family: 'Ma Shan Zheng', cursive;
    border-radius: 4px; padding: 2px 10px; transform: rotate(-2deg);
    box-shadow: 0 2px 8px rgba(200,69,60,0.3); letter-spacing: 2px;
  }
  .msg-user { background: linear-gradient(135deg, #3d3025, #564636); color: #f7f5f2; }
  .msg-ai { background: #fff; border: 1px solid #ede8e1; box-shadow: 0 1px 3px rgba(38,29,22,0.05); }
  .msg-ai pre { background: #17110c; color: #ede8e1; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; font-family: 'Consolas', monospace; font-size: 13px; }
  .msg-ai h3 { font-weight: 700; color: #261d16; margin: 12px 0 4px; font-size: 15px; }
  .msg-ai h4 { font-weight: 700; color: #3d3025; margin: 8px 0 2px; font-size: 14px; }
  .msg-ai strong { color: #261d16; }
  .msg-ai code:not(pre code) { background: #ede8e1; padding: 1px 5px; border-radius: 3px; font-size: 13px; color: #8a2d26; }
  .msg-ai ul, .msg-ai ol { padding-left: 20px; margin: 4px 0; }
  .msg-ai li { margin: 2px 0; }
  .tab-btn { transition: all 0.25s ease; position: relative; }
  .tab-btn.active { color: #c8453c; background: rgba(200,69,60,0.05); }
  .tab-btn.active::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #c8453c; border-radius: 0 2px 2px 0; }
  .chapter-card { transition: all 0.2s ease; cursor: pointer; }
  .chapter-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(38,29,22,0.12); }
  .ink-input { transition: all 0.2s; }
  .ink-input:focus { outline: none; border-color: #8a7960; box-shadow: 0 0 0 3px rgba(138,121,96,0.15); }
  .typing-dot { animation: blink 1.4s infinite both; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  .fade-in { animation: fadeIn 0.4s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .slide-up { animation: slideUp 0.3s ease both; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .skeleton { background: linear-gradient(90deg, #ede8e1 25%, #dcd3c7 50%, #ede8e1 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .toast-item { animation: toastIn 0.3s ease both; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
  .streaming-cursor::after { content: '▊'; color: #c8453c; animation: cursorBlink 0.8s infinite; }
  @keyframes cursorBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  @media (max-width: 768px) {
    .sidebar { position: fixed; left: -256px; z-index: 50; height: 100%; transition: left 0.3s; }
    .sidebar.open { left: 0; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; }
    .sidebar-overlay.show { display: block; }
  }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body class="h-screen overflow-hidden">
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="flex h-screen">
  <aside class="sidebar w-64 flex-shrink-0 flex flex-col paper-bg border-r border-ink-200" id="sidebar">
    <div class="p-6 border-b border-ink-200">
      <div class="flex items-center justify-between">
        <h1 class="font-brush text-3xl text-ink-900 leading-none">墨流</h1>
        <button class="md:hidden text-ink-400" id="close-sidebar">×</button>
      </div>
      <p class="text-xs text-ink-500 mt-1 font-xiaowei tracking-widest">小说创作工作台</p>
    </div>
    <nav class="flex-1 py-2">
      <button data-tab="chat" class="tab-btn active w-full px-6 py-3 text-left flex items-center gap-3 hover:bg-ink-50"><span class="text-lg">💬</span><span class="text-sm font-medium">对话创作</span></button>
      <button data-tab="volumes" class="tab-btn w-full px-6 py-3 text-left flex items-center gap-3 hover:bg-ink-50 text-ink-600"><span class="text-lg">📖</span><span class="text-sm font-medium">卷宗规划</span></button>
      <button data-tab="chapters" class="tab-btn w-full px-6 py-3 text-left flex items-center gap-3 hover:bg-ink-50 text-ink-600"><span class="text-lg">📜</span><span class="text-sm font-medium">章节列表</span></button>
      <button data-tab="settings" class="tab-btn w-full px-6 py-3 text-left flex items-center gap-3 hover:bg-ink-50 text-ink-600"><span class="text-lg">🎭</span><span class="text-sm font-medium">世界设定</span></button>
    </nav>
    <div class="p-4 border-t border-ink-200 text-xs text-ink-500">
      <div class="flex items-center gap-2 mb-1"><span id="status-dot" class="w-2 h-2 rounded-full bg-gold-500"></span><span id="status-text">连接中...</span></div>
      <div id="novel-info" class="text-ink-400 truncate">未加载</div>
    </div>
  </aside>
  <main class="flex-1 flex flex-col overflow-hidden">
    <div class="md:hidden flex items-center justify-between px-4 py-2 border-b border-ink-200 paper-bg">
      <button id="open-sidebar" class="text-ink-600">☰</button>
      <span class="font-brush text-lg text-ink-900">墨流</span>
      <div class="w-6"></div>
    </div>

    <!-- 对话创作 -->
    <section id="tab-chat" class="tab-pane flex-1 flex flex-col overflow-hidden">
      <header class="px-6 py-3 border-b border-ink-200 flex items-center justify-between paper-bg">
        <div><h2 class="text-base font-bold text-ink-900">对话创作</h2><p id="model-desc" class="text-xs text-ink-500 mt-0.5">选择助手模型开始创作</p></div>
        <div class="flex items-center gap-2">
          <select id="model-select" class="ink-input border border-ink-300 rounded-md px-3 py-2 text-sm bg-white max-w-[200px]"><option value="">加载中...</option></select>
          <button id="clear-chat" class="text-xs text-ink-500 hover:text-vermilion-600 px-2 py-2">清空</button>
        </div>
      </header>
      <div id="chat-messages" class="flex-1 overflow-y-auto scrollbar px-6 py-6 space-y-4">
        <div class="msg-ai rounded-lg p-5 max-w-3xl mx-auto fade-in">
          <p class="text-sm text-ink-700 leading-relaxed"><span class="font-brush text-vermilion-600 text-xl">歡迎。</span> 選擇上方的助手模型，告訴我你想創作什麼。</p>
          <div class="text-xs text-ink-500 mt-3 space-y-1 border-t border-ink-100 pt-3">
            <p>📝 <b>章節生成助手</b>：输入「生成第126章 沈夜发现验钞机真相」</p>
            <p>📐 <b>大綱規劃助手</b>：输入「列表」或「创建 新卷 第31-80章 摘要」</p>
            <p>🔧 <b>元數據回填助手</b>：输入「全部」查看缺失统计</p>
          </div>
        </div>
      </div>
      <div class="px-6 py-3 border-t border-ink-200 paper-bg">
        <div class="max-w-4xl mx-auto flex items-end gap-3">
          <textarea id="chat-input" rows="2" placeholder="描述你想创作的内容... (Enter 发送 / Shift+Enter 换行)" class="ink-input flex-1 border border-ink-300 rounded-lg px-4 py-3 text-sm resize-none bg-white"></textarea>
          <button id="send-btn" class="bg-ink-800 hover:bg-ink-900 text-ink-50 px-6 py-3 rounded-lg text-sm font-medium transition disabled:opacity-50 disabled:cursor-not-allowed">发送</button>
        </div>
      </div>
    </section>

    <!-- 卷宗规划 -->
    <section id="tab-volumes" class="tab-pane flex-1 overflow-y-auto scrollbar hidden">
      <header class="px-6 py-3 border-b border-ink-200 flex items-center justify-between paper-bg sticky top-0 z-10">
        <div><h2 class="text-base font-bold text-ink-900">卷宗规划</h2><p class="text-xs text-ink-500">千章小说的卷结构</p></div>
        <button id="new-volume-btn" class="bg-vermilion-500 hover:bg-vermilion-600 text-white px-4 py-2 rounded-md text-sm transition">+ 新建卷</button>
      </header>
      <div id="volumes-list" class="p-6 space-y-3"></div>
    </section>

    <!-- 章节列表 -->
    <section id="tab-chapters" class="tab-pane flex-1 overflow-y-auto scrollbar hidden">
      <header class="px-6 py-3 border-b border-ink-200 flex items-center justify-between paper-bg sticky top-0 z-10 flex-wrap gap-2">
        <div><h2 class="text-base font-bold text-ink-900">章节列表</h2><p class="text-xs text-ink-500" id="chapter-count">-</p></div>
        <div class="flex items-center gap-2 flex-wrap">
          <select id="volume-filter" class="ink-input border border-ink-300 rounded px-2 py-1 text-sm bg-white"><option value="">全部卷</option></select>
          <input id="chapter-search" type="text" placeholder="搜索标题..." class="ink-input w-32 border border-ink-300 rounded px-2 py-1 text-sm bg-white">
          <button id="prev-page" class="bg-ink-100 hover:bg-ink-200 text-ink-700 px-3 py-1 rounded text-sm">‹</button>
          <span id="page-info" class="text-xs text-ink-500 px-1">1-50</span>
          <button id="next-page" class="bg-ink-100 hover:bg-ink-200 text-ink-700 px-3 py-1 rounded text-sm">›</button>
        </div>
      </header>
      <div id="chapters-list" class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </section>

    <!-- 世界设定 -->
    <section id="tab-settings" class="tab-pane flex-1 overflow-y-auto scrollbar hidden">
      <header class="px-6 py-3 border-b border-ink-200 paper-bg sticky top-0 z-10"><h2 class="text-base font-bold text-ink-900">世界设定</h2><p class="text-xs text-ink-500">世界观 · 角色 · 伏笔</p></header>
      <div class="p-6 space-y-8 max-w-5xl">
        <div class="paper-bg border border-ink-200 rounded-lg p-5">
          <div class="flex items-center justify-between mb-4"><h3 class="font-xiaowei text-lg text-ink-900 flex items-center gap-2"><span>🌍</span> 世界观</h3><button id="edit-world-btn" class="text-xs text-ink-500 hover:text-vermilion-600">编辑</button></div>
          <div id="world-info" class="text-sm text-ink-700"></div>
        </div>
        <div><h3 class="font-xiaowei text-lg text-ink-900 mb-4 flex items-center gap-2"><span>🎭</span> 角色列表</h3><div id="characters-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div></div>
        <div><div class="flex items-center justify-between mb-4"><h3 class="font-xiaowei text-lg text-ink-900 flex items-center gap-2"><span>🪤</span> 伏笔矩阵</h3><button id="new-foreshadow-btn" class="text-xs bg-vermilion-500 hover:bg-vermilion-600 text-white px-3 py-1 rounded">+ 埋伏笔</button></div><div id="foreshadows-list" class="space-y-2"></div></div>
      </div>
    </section>
  </main>
</div>
<div id="toast-container" class="fixed top-4 right-4 z-[100] space-y-2"></div>
<div id="modal-container"></div>
<script>
const API = '/api/v1';
const OPENAI_API = '/v1';
const state = { models: [], currentModel: '', messages: [], volumes: [], volumeFilter: '', chapterSearch: '', chapterRange: { start: 1, end: 50 }, pageSize: 50 };

// Toast
function toast(msg, type, duration) {
  type = type || 'info'; duration = duration || 3000;
  const colors = { success: 'bg-bamboo-500', error: 'bg-vermilion-500', info: 'bg-ink-700', warn: 'bg-gold-500' };
  const icons = { success: '✓', error: '✕', info: 'ℹ', warn: '⚠' };
  const div = document.createElement('div');
  div.className = 'toast-item ' + (colors[type]||colors.info) + ' text-white px-4 py-3 rounded-lg shadow-lg text-sm flex items-center gap-2 max-w-sm';
  div.innerHTML = '<span class="font-bold">' + (icons[type]||icons.info) + '</span><span>' + escapeHtml(msg) + '</span>';
  document.getElementById('toast-container').appendChild(div);
  setTimeout(function() { div.style.opacity='0'; div.style.transform='translateX(100%)'; div.style.transition='all 0.3s'; setTimeout(function(){div.remove();}, 300); }, duration);
}

// Modal
function showModal(html) {
  document.getElementById('modal-container').innerHTML = '<div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" id="modal-overlay"><div class="bg-white rounded-lg max-w-lg w-full max-h-[85vh] overflow-y-auto scrollbar slide-up">' + html + '</div></div>';
  document.getElementById('modal-overlay').addEventListener('click', function(e) { if (e.target.id === 'modal-overlay') closeModal(); });
}
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }
function confirmDialog(title, msg) {
  return new Promise(function(resolve) {
    showModal('<div class="p-6"><h3 class="font-bold text-lg text-ink-900 mb-2">' + escapeHtml(title) + '</h3><p class="text-sm text-ink-600 mb-6">' + escapeHtml(msg) + '</p><div class="flex justify-end gap-3"><button id="confirm-no" class="px-4 py-2 text-sm text-ink-600 hover:bg-ink-100 rounded">取消</button><button id="confirm-yes" class="px-4 py-2 text-sm bg-vermilion-500 hover:bg-vermilion-600 text-white rounded">确认</button></div></div>');
    document.getElementById('confirm-yes').addEventListener('click', function() { closeModal(); resolve(true); });
    document.getElementById('confirm-no').addEventListener('click', function() { closeModal(); resolve(false); });
  });
}

function escapeHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function renderMarkdown(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/```([\s\S]*?)```/g, function(m,c){ return '<pre>'+c.trim()+'</pre>'; });
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
  html = html.replace(/\n/g, '<br>');
  html = html.replace(/<br>(<ul>)/g, '$1').replace(/(<\/ul>)<br>/g, '$1');
  html = html.replace(/<pre>([\s\S]*?)<\/pre>/g, function(m,c){ return '<pre>'+c.replace(/<br>/g,'\n')+'</pre>'; });
  return html;
}
function skeletonCard() { return '<div class="paper-bg border border-ink-200 rounded-lg p-4"><div class="skeleton h-4 w-1/3 mb-3"></div><div class="skeleton h-3 w-full mb-2"></div><div class="skeleton h-3 w-2/3"></div></div>'; }

async function api(path, options) {
  options = options || {};
  const res = await fetch(API + path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, options));
  if (!res.ok) { const err = await res.json().catch(function(){ return {detail: res.statusText}; }); throw new Error(typeof err.detail === 'string' ? err.detail : JSON.stringify(err.detail)); }
  return res.status === 204 ? null : res.json();
}

async function checkStatus() {
  try {
    const data = await api('/status');
    document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-bamboo-500';
    document.getElementById('status-text').textContent = '已连接';
    document.getElementById('novel-info').textContent = data.novel_title || data.title || '墨流';
  } catch(e) {
    document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-vermilion-500';
    document.getElementById('status-text').textContent = '未连接';
  }
}

// 模型
async function loadModels() {
  try {
    const res = await fetch(OPENAI_API + '/models');
    const data = await res.json();
    const sel = document.getElementById('model-select');
    sel.innerHTML = '';
    state.models = data.data || [];
    if (state.models.length === 0) { sel.innerHTML = '<option value="">无可用模型</option>'; return; }
    state.models.forEach(function(m) { const opt = document.createElement('option'); opt.value = m.id; opt.textContent = m.name || m.id; sel.appendChild(opt); });
    state.currentModel = state.models[0].id;
    updateModelDesc();
  } catch(e) { document.getElementById('model-select').innerHTML = '<option value="">加载失败</option>'; }
}
function updateModelDesc() {
  const m = state.models.find(function(x){ return x.id === state.currentModel; });
  document.getElementById('model-desc').textContent = (m && m.description) || '选择助手模型开始创作';
}
document.getElementById('model-select').addEventListener('change', function(e) { state.currentModel = e.target.value; updateModelDesc(); });

// 对话
const chatBox = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'fade-in flex ' + (role === 'user' ? 'justify-end' : 'justify-start');
  const inner = document.createElement('div');
  inner.className = (role === 'user' ? 'msg-user' : 'msg-ai') + ' rounded-lg p-4 max-w-3xl text-sm leading-relaxed';
  inner.innerHTML = role === 'user' ? escapeHtml(text).replace(/\n/g, '<br>') : renderMarkdown(text);
  div.appendChild(inner); chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
  return inner;
}
function addStreamingMessage() {
  const div = document.createElement('div');
  div.className = 'fade-in flex justify-start';
  div.innerHTML = '<div class="msg-ai rounded-lg p-4 max-w-3xl text-sm leading-relaxed streaming-cursor" id="streaming-msg"></div>';
  chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
  return document.getElementById('streaming-msg');
}
function addTyping() {
  const div = document.createElement('div');
  div.id = 'typing-indicator'; div.className = 'flex justify-start fade-in';
  div.innerHTML = '<div class="msg-ai rounded-lg p-4 max-w-3xl"><div class="flex gap-1 items-center"><span class="text-xs text-ink-400 mr-2">正在思考</span><span class="typing-dot w-2 h-2 bg-ink-400 rounded-full"></span><span class="typing-dot w-2 h-2 bg-ink-400 rounded-full"></span><span class="typing-dot w-2 h-2 bg-ink-400 rounded-full"></span></div></div>';
  chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  if (!state.currentModel) { toast('请先选择模型', 'warn'); return; }
  state.messages.push({ role: 'user', content: text });
  addMessage('user', text);
  chatInput.value = ''; sendBtn.disabled = true; addTyping();
  let streamEl = null; let fullText = '';
  try {
    const res = await fetch(OPENAI_API + '/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: state.currentModel, messages: state.messages, stream: true })
    });
    const typing = document.getElementById('typing-indicator'); if (typing) typing.remove();
    if (!res.ok) {
      const err = await res.json().catch(function(){ return { error: { message: res.statusText } }; });
      addMessage('assistant', '## ❌ 请求失败\n\n```\n' + (err.error?.message || JSON.stringify(err)) + '\n```');
      state.messages.pop(); return;
    }
    const reader = res.body.getReader(); const decoder = new TextDecoder(); let buffer = '';
    streamEl = addStreamingMessage();
    while (true) {
      const chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, { stream: true });
      const lines = buffer.split('\n'); buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try { const json = JSON.parse(data); const delta = json.choices?.[0]?.delta?.content; if (delta) { fullText += delta; streamEl.innerHTML = renderMarkdown(fullText); chatBox.scrollTop = chatBox.scrollHeight; } } catch(e) {}
      }
    }
    if (streamEl) streamEl.classList.remove('streaming-cursor');
    if (!fullText && streamEl) streamEl.innerHTML = '<span class="text-ink-400">(空响应)</span>';
    state.messages.push({ role: 'assistant', content: fullText });
  } catch(e) {
    const typing = document.getElementById('typing-indicator'); if (typing) typing.remove();
    if (streamEl) { streamEl.classList.remove('streaming-cursor'); if (!fullText) streamEl.remove(); }
    addMessage('assistant', '## ❌ 网络错误\n\n```\n' + e.message + '\n```');
    state.messages.pop(); toast('网络错误: ' + e.message, 'error');
  } finally { sendBtn.disabled = false; chatInput.focus(); }
}

  const isEdit = !!id; let f = {};
  if (isEdit) { try { const list = await api('/foreshadows'); f = list.find(function(x){ return x.id === id; }) || {}; } catch(e) {} }
  showModal('<div class="p-6"><h3 class="font-bold text-lg text-ink-900 mb-4">'+(isEdit?'编辑伏笔':'埋入伏笔')+'</h3><div class="space-y-4"><div><label class="text-xs text-ink-500 block mb-1">描述 *</label><textarea id="f-desc" rows="2" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white resize-none" placeholder="伏笔内容...">'+escapeHtml(f.description||'')+'</textarea></div><div class="grid grid-cols-2 gap-3"><div><label class="text-xs text-ink-500 block mb-1">类型</label><select id="f-type" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white"><option value="mystery" '+(f.type==='mystery'?'selected':'')+'>🔍 悬疑</option><option value="character" '+(f.type==='character'?'selected':'')+'>👤 角色</option><option value="object" '+(f.type==='object'?'selected':'')+'>📦 物品</option><option value="world" '+(f.type==='world'?'selected':'')+'>🌍 世界</option></select></div><div><label class="text-xs text-ink-500 block mb-1">优先级</label><select id="f-priority" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white"><option value="normal" '+(f.priority==='normal'?'selected':'')+'>普通</option><option value="high" '+(f.priority==='high'?'selected':'')+'>★ 高优</option><option value="low" '+(f.priority==='low'?'selected':'')+'>低</option></select></div></div><div class="grid grid-cols-2 gap-3"><div><label class="text-xs text-ink-500 block mb-1">埋入章节</label><input id="f-planted" type="number" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white" value="'+(f.planted_chapter||'')+'"></div>'+(isEdit?'<div><label class="text-xs text-ink-500 block mb-1">回收章节</label><input id="f-paid" type="number" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white" value="'+(f.paid_chapter||'')+'"></div>':'')+'</div>'+(isEdit?'<div><label class="text-xs text-ink-500 block mb-1">状态</label><select id="f-status" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white"><option value="planted" '+(f.status==='planted'?'selected':'')+'>已埋</option><option value="building" '+(f.status==='building'?'selected':'')+'>推进中</option><option value="paid" '+(f.status==='paid'?'selected':'')+'>已回收</option></select></div>':'')+'<div><label class="text-xs text-ink-500 block mb-1">备注</label><input id="f-notes" class="ink-input w-full border border-ink-300 rounded px-3 py-2 text-sm bg-white" value="'+escapeHtml(f.notes||'')+'"></div></div><div class="flex justify-end gap-3 mt-6"><button onclick="closeModal()" class="px-4 py-2 text-sm text-ink-600 hover:bg-ink-100 rounded">取消</button><button id="save-f-btn" class="px-4 py-2 text-sm bg-vermilion-500 hover:bg-vermilion-600 text-white rounded">'+(isEdit?'保存':'创建')+'</button></div></div>');
  document.getElementById('save-f-btn').addEventListener('click', async function() {
    const desc = document.getElementById('f-desc').value.trim();
    if (!desc) { toast('请填描述', 'warn'); return; }
    const body = { description: desc, type: document.getElementById('f-type').value, priority: document.getElementById('f-priority').value, planted_chapter: parseInt(document.getElementById('f-planted').value)||0, notes: document.getElementById('f-notes').value };
    try {
      if (isEdit) { body.status = document.getElementById('f-status').value; body.paid_chapter = parseInt(document.getElementById('f-paid').value)||0; await api('/foreshadows/'+id, { method: 'PUT', body: JSON.stringify(body) }); toast('伏笔已更新', 'success'); }
      else { await api('/foreshadows', { method: 'POST', body: JSON.stringify(body) }); toast('伏笔已创建', 'success'); }
      closeModal(); loadSettings();
    } catch(e) { toast('保存失败: ' + e.message, 'error'); }
  });
};
window.cycleForeshadowStatus = async function(id, current) {
  const next = { planted: 'building', building: 'paid', paid: 'planted' }[current] || 'planted';
  try { const body = { status: next }; await api('/foreshadows/'+id, { method: 'PUT', body: JSON.stringify(body) }); toast('状态已更新', 'success', 1500); loadSettings(); }
  catch(e) { toast('更新失败: ' + e.message, 'error'); }
};
window.confirmDeleteForeshadow = async function(id) {
  const ok = await confirmDialog('删除伏笔', '确认删除该伏笔？');
  if (!ok) return;
  try { await api('/foreshadows/'+id, { method: 'DELETE' }); toast('已删除', 'success'); loadSettings(); }
  catch(e) { toast('删除失败: ' + e.message, 'error'); }
};
document.getElementById('new-foreshadow-btn').addEventListener('click', function() { openForeshadowModal(); });

// 标签切换
const tabs = ['chat', 'volumes', 'chapters', 'settings'];
document.querySelectorAll('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.tab === tab); b.classList.toggle('text-ink-600', b.dataset.tab !== tab); });
    tabs.forEach(function(t) { const pane = document.getElementById('tab-'+t); if (pane) pane.classList.toggle('hidden', t !== tab); });
    if (tab === 'volumes') loadVolumes();
    if (tab === 'chapters' && !document.getElementById('chapters-list').dataset.loaded) { document.getElementById('chapters-list').dataset.loaded = '1'; loadChapters(); }
    if (tab === 'settings') loadSettings();
    // 移动端关闭侧边栏
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('show');
  });
});

// 移动端侧边栏
document.getElementById('open-sidebar').addEventListener('click', function() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-overlay').classList.add('show'); });
document.getElementById('close-sidebar').addEventListener('click', function() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('show'); });
document.getElementById('sidebar-overlay').addEventListener('click', function() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('show'); });

// 启动
(async function init() { await checkStatus(); await loadModels(); })();
</script>
</body>
</html>
