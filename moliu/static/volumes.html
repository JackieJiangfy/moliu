<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卷规划 - 墨流</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; }
.container { max-width: 1000px; margin: 0 auto; padding: 24px; }

.header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 24px; font-weight: 700; color: #1a1a1a; }
.header-actions { display: flex; gap: 8px; }

.btn { padding: 8px 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; color: #1a1a1a; cursor: pointer; font-size: 14px; transition: all .2s; }
.btn:hover { background: #f9fafb; }
.btn.primary { background: #3b82f6; color: #fff; border-color: #3b82f6; }
.btn.primary:hover { background: #2563eb; }
.btn.danger { background: #ef4444; color: #fff; border-color: #ef4444; }
.btn.danger:hover { background: #dc2626; }
.btn.small { padding: 4px 12px; font-size: 12px; }

/* 卷卡片 */
.volume-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.volume-card .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.volume-card .name { font-size: 18px; font-weight: 600; color: #1a1a1a; }
.volume-card .subtitle { color: #6b7280; font-size: 13px; }
.volume-card .range { font-size: 13px; color: #3b82f6; background: #3b82f611; padding: 2px 10px; border-radius: 12px; }
.volume-card .summary { color: #4b5563; font-size: 14px; line-height: 1.6; margin-bottom: 12px; }
.volume-card .status { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; }
.volume-card .status.planned { background: #3b82f611; color: #3b82f6; }
.volume-card .status.active { background: #10b98111; color: #10b981; }
.volume-card .status.completed { background: #6b728011; color: #6b7280; }
.volume-card .actions { display: flex; gap: 8px; margin-top: 12px; }

/* 表单弹窗 */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: #fff; border: 1px solid #e0e0e0; border-radius: 16px; padding: 28px; width: 90%; max-width: 520px; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
.modal h2 { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 4px; }
.form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; color: #1a1a1a; font-size: 14px; font-family: inherit; }
.form-group input:focus, .form-group textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px #3b82f622; }
.form-group textarea { min-height: 80px; resize: vertical; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

/* 空状态 */
.empty { text-align: center; padding: 60px; color: #666; }
.empty p { margin-bottom: 16px; }

.loading { text-align: center; padding: 60px; color: #888; }
.loading .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #2a2a2a; border-top-color: #3b82f6; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 统一导航栏 */
.navbar { display: flex; align-items: center; gap: 0; background: #fff; border-bottom: 1px solid #e0e0e0; padding: 0 24px; height: 48px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.navbar-brand { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-right: 24px; text-decoration: none; }
.navbar-nav { display: flex; gap: 0; list-style: none; }
.navbar-nav a { padding: 6px 14px; font-size: 13px; color: #6b7280; text-decoration: none; border-radius: 6px; transition: all .15s; }
.navbar-nav a:hover { background: #f3f4f6; color: #1a1a1a; }
.navbar-nav a.active { background: #3b82f611; color: #3b82f6; font-weight: 500; }
</style>
</head>
<body>
<div id="app">
  <nav class="navbar">
    <a class="navbar-brand" href="/static/dashboard.html">墨流</a>
    <ul class="navbar-nav">
      <li><a href="/static/dashboard.html">故事看板</a></li>
      <li><a href="/static/volumes.html" class="active">卷规划</a></li>
      <li><a href="/static/generator.html">生成章节</a></li>
      <li><a href="/docs">API 文档</a></li>
    </ul>
  </nav>
  <div class="container">
    <div class="header">
      <h1>📖 卷规划</h1>
      <div class="header-actions">
        <button class="btn primary" @click="showCreate = true">+ 新建卷</button>
        <button class="btn" @click="refresh">刷新</button>
      </div>
    </div>

    <div v-if="loading" class="loading">
      <div class="spinner"></div>
      <div>加载中...</div>
    </div>

    <template v-else>
      <div v-if="volumes.length === 0" class="empty">
        <p>暂无卷规划</p>
        <button class="btn primary" @click="showCreate = true">创建第一个卷</button>
      </div>

      <div v-for="v in volumes" :key="v.id" class="volume-card">
        <div class="top">
          <div>
            <div class="name">卷{{ v.id }}: {{ v.name || '(未命名)' }}</div>
            <div class="subtitle">{{ v.subtitle }}</div>
          </div>
          <span class="range">第{{ v.chapter_start }}-{{ v.chapter_end }}章</span>
        </div>
        <div class="summary">{{ v.summary || '暂无摘要' }}</div>
        <span class="status" :class="v.status">{{ statusLabel(v.status) }}</span>
        <div class="actions">
          <button class="btn small" @click="editVolume(v)">编辑</button>
          <button class="btn small danger" @click="deleteVolume(v)">删除</button>
        </div>
      </div>
    </template>

    <!-- 创建/编辑弹窗 -->
    <div class="modal-overlay" v-if="showCreate || showEdit" @click.self="closeForm">
      <div class="modal">
        <h2>{{ showEdit ? '编辑卷' : '新建卷' }}</h2>
        <div class="form-group">
          <label>卷名称</label>
          <input v-model="form.name" placeholder="如：亡灵银行">
        </div>
        <div class="form-group">
          <label>副标题</label>
          <input v-model="form.subtitle" placeholder="如：社畜入职地府">
        </div>
        <div class="form-group">
          <label>章节范围</label>
          <input v-model="form.range" placeholder="如：1-30">
        </div>
        <div class="form-group">
          <label>摘要</label>
          <textarea v-model="form.summary" placeholder="卷的剧情摘要..."></textarea>
        </div>
        <div class="form-actions">
          <button class="btn" @click="closeForm">取消</button>
          <button class="btn primary" @click="saveVolume">{{ showEdit ? '保存' : '创建' }}</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const { createApp, ref, reactive, onMounted } = Vue;

createApp({
  setup() {
    const loading = ref(true);
    const volumes = ref([]);
    const showCreate = ref(false);
    const showEdit = ref(false);
    const editingId = ref(null);
    const form = reactive({ name: '', subtitle: '', range: '', summary: '' });

    const api = (path) => window.location.origin + '/api/v1' + path;

    const fetchVolumes = async () => {
      try {
        const r = await fetch(api('/volumes'));
        volumes.value = await r.json();
      } catch (e) {
        console.error('Failed to fetch volumes:', e);
      }
    };

    const refresh = async () => {
      loading.value = true;
      await fetchVolumes();
      loading.value = false;
    };

    onMounted(refresh);

    const statusLabel = (s) => {
      const map = { planned: '规划中', active: '进行中', completed: '已完成' };
      return map[s] || s;
    };

    const closeForm = () => {
      showCreate.value = false;
      showEdit.value = false;
      editingId.value = null;
      form.name = ''; form.subtitle = ''; form.range = ''; form.summary = '';
    };

    const saveVolume = async () => {
      if (!form.name || !form.range) {
        alert('卷名称和章节范围不能为空');
        return;
      }
      const parts = form.range.split('-');
      const body = {
        name: form.name,
        subtitle: form.subtitle,
        chapter_start: parseInt(parts[0]),
        chapter_end: parts.length > 1 ? parseInt(parts[1]) : parseInt(parts[0]),
        summary: form.summary,
      };

      try {
        if (showEdit.value) {
          await fetch(api('/volumes/' + editingId.value), {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
        } else {
          await fetch(api('/volumes'), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
        }
        closeForm();
        await fetchVolumes();
      } catch (e) {
        console.error('Failed to save volume:', e);
        alert('保存失败');
      }
    };

    const editVolume = (v) => {
      editingId.value = v.id;
      form.name = v.name;
      form.subtitle = v.subtitle;
      form.range = v.chapter_start + '-' + v.chapter_end;
      form.summary = v.summary;
      showEdit.value = true;
    };

    const deleteVolume = async (v) => {
      if (!confirm('确定删除卷' + v.id + '「' + v.name + '」吗？')) return;
      try {
        await fetch(api('/volumes/' + v.id), { method: 'DELETE' });
        await fetchVolumes();
      } catch (e) {
        console.error('Failed to delete volume:', e);
        alert('删除失败');
      }
    };

    return { loading, volumes, showCreate, showEdit, form, refresh, statusLabel, closeForm, saveVolume, editVolume, deleteVolume };
  }
}).mount('#app');
</script>
</body>
</html>
