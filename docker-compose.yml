# 墨流 + OpenWebUI 部署配置
# 同时启动 OpenWebUI 前端和墨流 FastAPI 后端
#
# 启动方式:
#   docker compose up -d
#
# 访问:
#   OpenWebUI: http://localhost:3000
#   墨流 API:  http://localhost:8000
#   墨流看板:  http://localhost:8000/static/dashboard.html

version: "3.8"

services:
  # ==================== 墨流 FastAPI 后端 ====================
  moliu-api:
    image: python:3.11-slim
    container_name: moliu-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 挂载当前项目目录（包含 data/ 和 output/）
      - .:/app
    working_dir: /app
    environment:
      - MO_DEEPSEEK_API_KEY=${MO_DEEPSEEK_API_KEY:-}
      - MO_DEEPSEEK_BASE_URL=${MO_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "pip install -e . --quiet 2>/dev/null &&
             python -m uvicorn moliu.api:app --host 0.0.0.0 --port 8000"

  # ==================== OpenWebUI 前端 ====================
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      - moliu-api
    environment:
      # 连接墨流后端
      - MOLIU_API_URL=http://moliu-api:8000
      # OpenWebUI 配置（通过 Admin Panel 手动配置 Pipelines）
      # Pipelines 插件需要通过 OpenWebUI Admin Panel > 设置 > Pipelines 导入
    volumes:
      - openwebui-data:/app/backend/data
      # 挂载 Pipelines 插件（通过 Admin Panel 导入）
      - ./moliu/pipelines:/app/pipelines

volumes:
  openwebui-data: