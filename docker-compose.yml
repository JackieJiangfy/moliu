# 墨流 + OpenWebUI 部署配置
#
# 墨流后端在本地运行: python -m uvicorn moliu.api:app --host 0.0.0.0 --port 8000 --reload
# OpenWebUI 通过 Docker 启动，通过 host.docker.internal 访问墨流后端
#
# 启动方式:
#   docker compose up -d
#
# 访问:
#   OpenWebUI: http://localhost:3000  ← 主界面（聊天创作，唯一前端）
#   墨流 API:  http://localhost:8000  ← 后端 API（不提供前端页面）
#
# OpenWebUI 配置步骤（首次使用）:
#   1. 访问 http://localhost:3000 注册管理员账号
#   2. 管理员面板 → 设置 → 外部链接 → 添加 OpenAI 兼容 API
#      - URL: http://host.docker.internal:8000/v1
#      - API Key: moliu（随意填，墨流不校验）
#      - 模型会自动出现: 📝 章节生成助手、📐 大纲规划助手、🔧 元数据回填助手
#   3. 同时添加 DeepSeek API（用于实际 LLM 调用）
#      - URL: https://api.deepseek.com/v1
#      - API Key: 你的 DeepSeek API Key
#   4. 在模型选择器中选择 "📝 章节生成助手" 开始对话创作

version: "3.8"

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      # 允许注册（首次使用）
      - WEBUI_AUTH=true
      # 允许外部连接
      - ENABLE_OLLAMA_API=false
    volumes:
      - openwebui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  openwebui-data:
