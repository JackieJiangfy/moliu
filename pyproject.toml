[project]
name = "moliu"
version = "0.1.0"
description = "墨流 - AI 小说创作工作流引擎"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "tenacity>=9.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
mo = "moliu.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["moliu*"]
exclude = ["tests*", "data*", "output*", "设计文档*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.22",
    "pytest-mock>=3.12",
    "respx>=0.20",
    "ruff>=0.1",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "integration: requires real DeepSeek API key",
]

[tool.ruff]
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long
    "F401",  # unused import
]
line-length = 120

[tool.mypy]
python_version = "3.11"
strict = false
show_error_codes = true
ignore_missing_imports = true
